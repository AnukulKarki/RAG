readme = "README.md"
authors = [
    { email = "anukulkarki11@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "google-genai>=2.31.0",
    "langchain>=1.4.6",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.10",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.15",
    "langsmith>=0.14.8",
    "pypdf>=6.21.1",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
